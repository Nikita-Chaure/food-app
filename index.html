<!DOCTYPE html>
<html>
<head>
    <title>FoodShare Pro</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ffffff);
        }

        .card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            font-weight: 800;
            margin-top: 20px;
        }

        #map {
            height: 250px;
            border-radius: 12px;
        }

        .food-box {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 class="title">🍱 FoodShare Platform</h2>

    <!-- FORM -->
    <div class="card p-4 mt-3">

        <h5>Add Food</h5>

        <input id="name" class="form-control mb-2" placeholder="Food Name">
        <input id="quantity" class="form-control mb-2" placeholder="Quantity">
        <input id="phone" class="form-control mb-2" placeholder="Phone">
        <input id="type" class="form-control mb-2" placeholder="veg / non-veg">

        <!-- MAP -->
        <div id="map"></div>
        <p id="selected" class="text-muted mt-2">Click map to select location</p>

        <button class="btn btn-success w-100 mt-2" onclick="addFood()">➕ Add Food</button>
    </div>

    <!-- LIST -->
    <div class="card p-4 mt-4 mb-5">

        <h5>Available Food</h5>
        <button class="btn btn-primary btn-sm mb-2" onclick="loadFood()">Refresh</button>

        <div id="foodList"></div>

        <hr>

        <h6>🤖 Smart Match Result</h6>
        <button class="btn btn-dark btn-sm" onclick="smartMatch()">Find Best NGO</button>
        <p id="matchResult" class="mt-2 text-success"></p>

    </div>

</div>

<script>

/* ---------------- MAP ---------------- */
let map = L.map('map').setView([18.5204, 73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

let lat = null;
let lng = null;
let locationText = "";

map.on('click', function(e) {
    lat = e.latlng.lat;
    lng = e.latlng.lng;

    locationText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

    document.getElementById("selected").innerText =
        "Selected: " + locationText;

    L.marker([lat, lng]).addTo(map);
});

/* ---------------- ADD FOOD ---------------- */
async function addFood() {
    const data = {
        name: document.getElementById("name").value,
        location: locationText,
        quantity: document.getElementById("quantity").value,
        phone: document.getElementById("phone").value,
        type: document.getElementById("type").value,
        lat: lat,
        lng: lng,
        urgency: 20
    };

    await fetch('/add-food', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });

    alert("Food Added!");
    loadFood();
}

/* ---------------- LOAD FOOD ---------------- */
async function loadFood() {
    const res = await fetch('/get-food');
    const data = await res.json();

    const list = document.getElementById("foodList");
    list.innerHTML = "";

    data.forEach((item, i) => {

        const mapLink = `https://www.google.com/maps/search/?api=1&query=${item.location}`;

        list.innerHTML += `
            <div class="food-box shadow-sm">
                <b>🍛 ${item.name}</b><br>
                📍 ${item.location}<br>
                📞 ${item.phone}<br>
                🥗 ${item.type}<br>

                <a href="${mapLink}" target="_blank">🗺 View Map</a><br><br>

                <button class="btn btn-danger btn-sm" onclick="claimFood(${i})">
                    Claim
                </button>
            </div>
        `;
    });
}

/* ---------------- CLAIM ---------------- */
async function claimFood(index) {
    await fetch('/claim-food', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index})
    });

    loadFood();
}

/* ---------------- SMART MATCH ---------------- */
async function smartMatch() {

    const sampleFood = {
        lat: lat,
        lng: lng,
        type: document.getElementById("type").value,
        urgency: 20
    };

    const res = await fetch('/smart-match', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(sampleFood)
    });

    const data = await res.json();

    document.getElementById("matchResult").innerText =
        "Best NGO: " + data.best_match.name + " (Score: " + data.score + ")";
}

loadFood();

</script>

</body>
</html>
